[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipside"
version = "0.1.0"
description = "Ship iOS apps to App Store Connect from the command line - metadata, screenshots, and submission, with the failure modes already solved."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shipside" }]
keywords = ["app-store-connect", "ios", "fastlane", "submission", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PyJWT>=2.6",
  "cryptography>=41",
  # tomllib is stdlib from 3.11; the backport is required for the >=3.9 floor
  # declared below. See the guarded import in shipside/config.py.
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# tomli is unconditional in dev (not marker-gated) on purpose: it is only a
# real dependency below Python 3.11, but tests/test_py39_compat.py must be able
# to exercise that fallback branch on every interpreter, including 3.12+.
# Dev extras are never installed by consumers, so this costs end users nothing.
dev = ["pytest>=7", "tomli>=2.0"]

[project.scripts]
shipside = "shipside.cli:main"

[project.urls]
Homepage = "https://shipside-app.vercel.app"
Documentation = "https://github.com/rorshopping/shipside#readme"

[tool.hatch.build.targets.wheel]
packages = ["shipside"]
