[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipside"
version = "0.1.0"
description = "Ship iOS apps to App Store Connect from the command line - metadata, screenshots, and submission, with the failure modes already solved."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shipside" }]
keywords = ["app-store-connect", "ios", "fastlane", "submission", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PyJWT>=2.6",
  "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shipside = "shipside.cli:main"

[project.urls]
Homepage = "https://shipside-app.vercel.app"
Documentation = "https://github.com/rorshopping/shipside#readme"

[tool.hatch.build.targets.wheel]
packages = ["shipside"]
