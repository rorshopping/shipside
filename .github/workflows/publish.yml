name: publish

# Publishing is driven by a GitHub Release, not a raw tag push, so a release
# can be drafted and inspected before anything leaves the machine.
#
# ONE-TIME SETUP (Richard, ~3 min) - cannot be done from CI:
#   1. pypi.org/account -> Create an account (or sign in)
#   2. Project -> New Project -> name: shipside
#   3. Project -> Publishing -> add a GitHub publisher:
#        Owner:        rorshopping
#        Repository:   shipside
#        Workflow:     publish.yml
#        Environment:  (leave blank unless you created one named pypi)
#   4. Save. No API token needed - PyPI mints a short-lived one per run.
#
# After that, cutting a release publishes automatically.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # REQUIRED by PyPI Trusted Publishing - do not remove
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
